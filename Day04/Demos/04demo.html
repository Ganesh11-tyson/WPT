<html>
  <head>
    <title>Test Table</title>
  </head>
  <body>
    <table border="1" style="height: 200px; width: 200px; text-align: center">
      <tr>
        <td>1</td>
        <td>1</td>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td colspan="4">4</td>
      </tr>
      <tr>
        <td>1</td>
        <td colspan="3">3</td>
      </tr>
      <tr>
        <td>1</td>
        <td>1</td>
        <td colspan="2">2</td>
      </tr>

      <tr>
        <td rowspan="2">1</td>
        <td>1</td>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td>1</td>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td colspan="2" rowspan="2">2</td>
        <td>1</td>
        <td>1</td>
      </tr>

      <tr>
        <td>1</td>
        <td>1</td>
      </tr>
    </table>
  </body>
</html>
