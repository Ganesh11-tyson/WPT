<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <!-- <input type="button" value="Click Me" onclick="Flip()" /> -->
    <div
      id="myDiv"
      style="height: 300px; width: 300px; background-color: cadetblue"
      onmouseover="Flip()"
      onmouseout="Flip()"
    ></div>

    <script>
      var flag = true;
      function Flip() {
        var refTomyDiv = document.getElementById("myDiv");
        if (flag == true) {
          refTomyDiv.style.backgroundColor = "yellow";
          flag = false;
        } else {
          refTomyDiv.style.backgroundColor = "cadetblue";
          flag = true;
        }
      }
    </script>
  </body>
</html>
